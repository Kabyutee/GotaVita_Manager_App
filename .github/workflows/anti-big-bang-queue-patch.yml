name: ANTI BIG BANG — apply controlled queue adapter patch

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Apply narrowly scoped queue adapter bridge
        shell: python
        run: |
          from pathlib import Path
          path = Path("script.js")
          text = path.read_text(encoding="utf-8")

          old = '''function cloudSyncAdapterReady() {
  return false;
}'''
          new = '''function cloudSyncAdapterReady() {
  // The modular GVData facade is now the authoritative Supabase adapter.
  // Legacy script.js delegates to it instead of holding the transaction queue.
  return (
    typeof window.GVData?.sync === "function" &&
    typeof window.GVData?.health === "function"
  );
}'''

          if old in text:
              text = text.replace(old, new, 1)
          elif "typeof window.GVData?.sync === \"function\"" in text:
              pass
          else:
              raise SystemExit("Expected cloudSyncAdapterReady boundary not found")

          marker = '''    /*
     * Do not write transaction records until the schema
     * adapter exists. Authentication/RLS has already been
     * validated separately and this keeps the application
     * safely local-first rather than sending malformed rows.
     */
    if (
      !cloudSyncAdapterReady()
    ) {'''

          if marker in text:
              body_start = text.find(marker) + len(marker)
              end_marker = '''    /*
     * Reserved for the schema-adapter phase.
     */'''
              end = text.find(end_marker, body_start)
              if end < 0:
                  raise SystemExit("Expected reserved adapter boundary not found")

              replacement = '''
      const result =
        typeof window.GVData?.sync === "function"
          ? await window.GVData.sync(true)
          : false;

      const currentQueue = getSyncQueue();

      if (result?.ok === true || result === true) {
        updateSyncStatus(
          currentQueue.length
            ? "Cloud connected · queue protected · " + currentQueue.length + " queued"
            : "Cloud connected",
          "online"
        );
        return true;
      }

      updateSyncStatus(
        currentQueue.length
          ? "Cloud connected · local queue protected · " + currentQueue.length + " queued"
          : "Cloud connected",
        "online"
      );

      return false;
    }

'''
              text = text[:body_start] + replacement + text[end:]

          path.write_text(text, encoding="utf-8")

      - name: Syntax check
        run: node --check script.js

      - name: Commit patch when changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- script.js; then
            echo "Queue adapter patch already applied."
            exit 0
          fi
          git add script.js
          git commit -m "Sprint 12 — delegate legacy sync to authoritative GVData adapter"
          git push