name: JARVIS apply group picker fix

on:
  push:
    branches:
      - fix/group-picker-action-args-20260902

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[group-picker-fix-applied]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/group-picker-action-args-20260902
          fetch-depth: 1
      - name: Apply deterministic fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('js/modules/groups-routes.js')
          s = p.read_text()
          old = 'const args = JSON.stringify([groupPickerOrderIds, g.name]);'
          new = 'const args = [groupPickerOrderIds, g.name];'
          if old not in s:
              raise SystemExit('Expected buggy group-picker argument construction was not found.')
          s = s.replace(old, new, 1)
          p.write_text(s)
          print('Applied:', old, '->', new)
          PY
      - name: Add regression contract
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/ui-action-wiring-contract.test.js')
          s = p.read_text()
          needle = 'assert.deepEqual(malformedArgs, [], `Malformed data-action-args: ${JSON.stringify(malformedArgs)}`);\n'
          addition = needle + '''\n// Guard against the double-stringified argument shape that breaks runtime dispatch.\nconst groupsRoutes = fs.readFileSync(path.join(root, "js/modules/groups-routes.js"), "utf8");\nassert.doesNotMatch(\n  groupsRoutes,\n  /const\\s+args\\s*=\\s*JSON\\.stringify\\(\\[groupPickerOrderIds,\\s*g\\.name\\]\\)/,\n  "Group Picker action arguments must remain an array before jsAttrArg encoding."\n);\nassert.match(\n  groupsRoutes,\n  /const\\s+args\\s*=\\s*\\[groupPickerOrderIds,\\s*g\\.name\\]/,\n  "Group Picker action arguments must be passed to jsAttrArg as an array."\n);\n'''
          if needle not in s:
              raise SystemExit('Regression-test insertion point not found.')
          p.write_text(s.replace(needle, addition, 1))
          PY
      - name: Verify patch
        run: |
          node --check js/modules/groups-routes.js
          node tests/ui-action-wiring-contract.test.js
      - name: Remove temporary workflow and commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/jarvis-apply-group-picker-fix.yml
          git add js/modules/groups-routes.js tests/ui-action-wiring-contract.test.js
          git commit -m 'fix: correct Group Picker action arguments [group-picker-fix-applied]'
          git push origin HEAD:fix/group-picker-action-args-20260902
