name: JARVIS Canonical Payload Authority Repair

on:
  push:
    branches:
      - jarvis/canonical-payload-authority-2026-08-23

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, 'JARVIS: repair canonical payload precedence') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair legacy payload precedence
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('js/core/data-gateway.js')
          text = path.read_text(encoding='utf-8')

          old = '''  function mergePayload(\n    original,\n    payload\n  ) {\n    return {\n      ...(payload || {}),\n      ...(\n        original &&\n        typeof original === "object"\n          ? original\n          : {}\n      )\n    };\n  }'''

          new = '''  function mergePayload(\n    original,\n    payload\n  ) {\n    // legacy_payload is historical compatibility data only.\n    // Canonical Supabase columns MUST win over stale legacy fields; otherwise\n    // a successful remote edit can be read back as an older browser value.\n    return {\n      ...(\n        original &&\n        typeof original === "object"\n          ? original\n          : {}\n      ),\n      ...(payload || {})\n    };\n  }'''

          if old not in text:
              raise SystemExit('Expected mergePayload implementation not found; refusing an unsafe rewrite.')

          path.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Add regression contract
        shell: python
        run: |
          from pathlib import Path
          path = Path('tests/sprint23-canonical-payload-authority-contract.test.js')
          path.write_text('''const fs = require("node:fs");\nconst assert = require("node:assert/strict");\n\nconst source = fs.readFileSync("js/core/data-gateway.js", "utf8");\nconst start = source.indexOf("function mergePayload(");\nassert.notEqual(start, -1, "mergePayload must exist");\nconst block = source.slice(start, source.indexOf("\\n  }", start) + 4);\n\nconst legacy = block.indexOf("original &&");\nconst canonical = block.indexOf("...(payload || {})");\nassert(legacy >= 0, "legacy payload merge must remain supported");\nassert(canonical > legacy, "canonical payload must be merged after legacy payload");\n\nconsole.log("Sprint 23 canonical payload authority contract: PASS");\n''', encoding='utf-8')

      - name: Run contract
        run: node tests/sprint23-canonical-payload-authority-contract.test.js

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/core/data-gateway.js tests/sprint23-canonical-payload-authority-contract.test.js
          if git diff --cached --quiet; then
            echo "No repair changes required."
            exit 0
          fi
          git commit -m "JARVIS: repair canonical payload precedence"
          git push origin HEAD
