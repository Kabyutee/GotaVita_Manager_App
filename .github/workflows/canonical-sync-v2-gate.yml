name: Canonical Sync v2 Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  canonical-sync-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply proven surgical v2 repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('js/core/sync-manager.js')
          text = path.read_text()

          replacements = [
            ('''  async function fetchRemoteSet(resources) {\n    const results = {};\n    const failures = [];\n    await Promise.all(resources.map(async (resource) => {''',
             '''  async function fetchRemoteSet(resources) {\n    const results = {};\n    const failures = [];\n    const uniqueResources = [...new Set(resources)];\n    await Promise.all(uniqueResources.map(async (resource) => {'''),
            ('''  async function executeMutation(entry, remoteRows, baseline) {\n    const remoteRow = rowMap(entry.resource, remoteRows).get(entry.key);\n    const previous = baselineRow(entry.resource, baseline, entry.key);''',
             '''  function remoteOrderTombstone(remoteDeletedRows, key) {\n    return rowMap("deleted_orders", remoteDeletedRows).get(key);\n  }\n\n  async function executeMutation(entry, remoteRows, baseline, remoteDeletedRows = []) {\n    const remoteRow = rowMap(entry.resource, remoteRows).get(entry.key);\n    const previous = baselineRow(entry.resource, baseline, entry.key);\n    const remoteTombstone = entry.resource === "orders" ? remoteOrderTombstone(remoteDeletedRows, entry.key) : null;\n    if (remoteTombstone && rowTime(remoteTombstone) >= mutationTime(entry)) {\n      return { remoteWon: true, applied: false, remoteTombstone: true };\n    }'''),
            ('executeMutation(entry, remoteFirst.results[entry.resource] || [], bootstrapBaseline)',
             'executeMutation(entry, remoteFirst.results[entry.resource] || [], bootstrapBaseline, remoteFirst.results["deleted_orders"] || [])'),
            ('executeMutation(entry, remoteFirst.results[entry.resource] || [], baseline)',
             'executeMutation(entry, remoteFirst.results[entry.resource] || [], baseline, remoteFirst.results["deleted_orders"] || [])')
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected surgical pattern not found: {old[:80]}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Syntax checks
        run: |
          node --check js/core/sync-manager.js
          node --check js/core/ui-bridge.js
          node --check worker.js

      - name: Canonical architecture contract
        run: node tests/canonical-sync-v2-architecture.test.js

      - name: Deterministic convergence, adversarial safety, failure durability, and efficiency simulation
        run: node tests/canonical-sync-v2-simulation.test.js

      - name: First-run bootstrap safety simulation
        run: node tests/canonical-sync-v2-bootstrap-safety.test.js

      - name: Existing sync contracts
        run: |
          node tests/phase4-cross-device-sync.test.js
          node tests/sprint12-live-sync-polling-contract.test.js
          node tests/sprint18-transaction-sync-readiness-contract.test.js
          node tests/sprint21-whole-sync-hardening-contract.test.js

      - name: Repository integrity
        run: |
          test -s index.html
          test -s script.js
          test -s js/core/data-gateway.js
          test -s js/core/state.js
          test -s js/modules/orders.js
          test -s js/modules/clients.js
          test -s js/modules/products.js
          test -s js/modules/expenses.js
          test -s js/modules/groups-routes.js
          test -s js/modules/employees-payroll.js
          test -s js/modules/reports.js
          test -s js/modules/containers.js
          test -s js/modules/backups.js

      - name: Commit proven repair into candidate branch
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- js/core/sync-manager.js; then
            echo "Canonical v2 repair already present."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/core/sync-manager.js
          git commit -m 'fix: enforce tombstone authority and deduplicate sync reads'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
