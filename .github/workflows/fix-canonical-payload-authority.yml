name: One-off canonical payload authority repair

on:
  push:
    branches:
      - fix/canonical-payload-authority

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair canonical payload precedence
        shell: python
        run: |
          from pathlib import Path

          path = Path("js/core/data-gateway.js")
          text = path.read_text(encoding="utf-8")

          old = '''  function mergePayload(\n    original,\n    payload\n  ) {\n    return {\n      ...(payload || {}),\n      ...(\n        original &&\n        typeof original === "object"\n          ? original\n          : {}\n      )\n    };\n  }'''

          new = '''  function mergePayload(\n    original,\n    payload\n  ) {\n    // legacy_payload is historical compatibility data only.\n    // Canonical Supabase columns MUST win over stale legacy fields; otherwise\n    // a successful remote edit can be read back as an older browser value.\n    return {\n      ...(\n        original &&\n        typeof original === "object"\n          ? original\n          : {}\n      ),\n      ...(payload || {})\n    };\n  }'''

          if old not in text:
              raise SystemExit("Expected mergePayload implementation not found; refusing unsafe rewrite.")

          path.write_text(text.replace(old, new, 1), encoding="utf-8")

      - name: Add regression contract
        shell: bash
        run: |
          cat > tests/sprint23-canonical-payload-authority-contract.test.js <<'EOF'
          const fs = require("node:fs");
          const assert = require("node:assert/strict");

          const source = fs.readFileSync("js/core/data-gateway.js", "utf8");
          const start = source.indexOf("function mergePayload(");
          assert.notEqual(start, -1, "mergePayload must exist");
          const end = source.indexOf("\n  }", start);
          assert.notEqual(end, -1, "mergePayload must be complete");
          const block = source.slice(start, end + 4);

          const legacy = block.indexOf("original &&");
          const canonical = block.indexOf("...(payload || {})");
          assert(legacy >= 0, "legacy payload fallback must remain supported");
          assert(canonical > legacy, "canonical payload must be merged after legacy payload");

          console.log("Sprint 23 canonical payload authority contract: PASS");
          EOF
          node tests/sprint23-canonical-payload-authority-contract.test.js
          node --check js/core/data-gateway.js

      - name: Commit repair and remove one-off workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/core/data-gateway.js tests/sprint23-canonical-payload-authority-contract.test.js
          git rm .github/workflows/fix-canonical-payload-authority.yml
          git commit -m "fix: make canonical Supabase fields authoritative"
          git push origin HEAD
