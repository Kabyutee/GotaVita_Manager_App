name: ANTI BIG BANG — isolated browser preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  deployments: write

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4

      - name: Apply ANTI BIG BANG 2.2 interaction boundary to preview workspace
        shell: python
        run: |
          from pathlib import Path

          path = Path("js/core/sync-manager.js")
          text = path.read_text(encoding="utf-8")

          if "ANTI BIG BANG 2.2" in text:
              print("ANTI BIG BANG 2.2 already present in candidate.")
          else:
              start = text.find("  function beginUserInteraction() {")
              end = text.find("  function renderSyncedState() {", start)
              if start < 0 or end < 0:
                  raise SystemExit("Expected ANTI BIG BANG 2.1 interaction boundary not found")

              replacement = '''  // ANTI BIG BANG 2.2 — focused controls define the interaction boundary.
  // Native select/checkbox popups can release pointer events while the control
  // remains focused, so pointerup timing alone must never permit destructive
  // background rendering.
  function activeFormControl() {
    try {
      const active = document.activeElement;
      return active?.closest?.("input, select, textarea, button") || null;
    } catch (_) {
      return null;
    }
  }

  function interactionIsProtected() {
    return Boolean(activeInteraction || activeFormControl());
  }

  function beginUserInteraction() {
    activeInteraction = true;
    if (interactionReleaseTimer) {
      clearTimeout(interactionReleaseTimer);
      interactionReleaseTimer = null;
    }
  }

  function endUserInteractionSoon() {
    if (interactionReleaseTimer) clearTimeout(interactionReleaseTimer);
    interactionReleaseTimer = setTimeout(() => {
      interactionReleaseTimer = null;
      if (activeFormControl()) return;
      activeInteraction = false;

      if (deferredRender) {
        deferredRender = false;
        renderSyncedState();
      }
    }, INTERACTION_RELEASE_MS);
  }

  function installInteractionGuard() {
    if (typeof document === "undefined" || typeof document.addEventListener !== "function") {
      return;
    }

    document.addEventListener("pointerdown", (event) => {
      const control = event.target?.closest?.("input, select, textarea, button");
      if (control) beginUserInteraction();
    }, true);

    document.addEventListener("keydown", (event) => {
      const control = event.target?.closest?.("input, select, textarea, button");
      if (control) beginUserInteraction();
    }, true);

    document.addEventListener("focusin", (event) => {
      const control = event.target?.closest?.("input, select, textarea, button");
      if (control) beginUserInteraction();
    }, true);

    document.addEventListener("focusout", (event) => {
      const control = event.target?.closest?.("input, select, textarea, button");
      if (control) endUserInteractionSoon();
    }, true);
  }

'''

              text = text[:start] + replacement + text[end:]
              text = text.replace("ANTI BIG BANG 2.1 — live cross-device gate", "ANTI BIG BANG 2.2 — live cross-device gate", 1)

          if "function activeFormControl" not in text or "interactionIsProtected" not in text:
              raise SystemExit("ANTI BIG BANG 2.2 patch verification failed")

          old_guard = '''  function renderSyncedState() {
    if (activeInteraction) {
      deferredRender = true;
      return;
    }
'''
          new_guard = '''  function renderSyncedState() {
    if (interactionIsProtected()) {
      deferredRender = true;
      return;
    }
'''

          if old_guard in text:
              text = text.replace(old_guard, new_guard, 1)
          elif "if (interactionIsProtected())" not in text:
              raise SystemExit("Expected render protection guard not found")

          path.write_text(text, encoding="utf-8")

      - name: Verify actual 2.2 candidate code
        shell: bash
        run: |
          node --check worker.js
          node --check js/core/sync-manager.js
          grep -q "ANTI BIG BANG 2.2" js/core/sync-manager.js
          grep -q "interactionIsProtected" js/core/sync-manager.js
          grep -q "focusin" js/core/sync-manager.js
          echo "Verified: preview workspace contains the ANTI BIG BANG 2.2 interaction fix."

      - name: Deploy isolated candidate Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.124.0"
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: >-
            deploy
            --name gotavita-manager-pr-${{ github.event.pull_request.number }}
            --var GV_RELEASE_SHA:${{ github.event.pull_request.head.sha }}

      - name: Publish preview gate details
        run: |
          echo "Candidate commit: ${{ github.event.pull_request.head.sha }}"
          echo "Preview Worker: gotavita-manager-pr-${{ github.event.pull_request.number }}"
          echo "Production was not targeted by this workflow."
