name: ANTI BIG BANG — isolated browser preview

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact candidate commit SHA to deploy
        required: true
        type: string
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  deployments: write

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve exact candidate SHA
        id: candidate
        shell: bash
        env:
          EVENT_SHA: ${{ github.event.pull_request.head.sha }}
          INPUT_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          candidate="$EVENT_SHA"
          if [ -n "$INPUT_SHA" ]; then candidate="$INPUT_SHA"; fi
          if [ -z "$candidate" ]; then exit 1; fi
          echo "sha=$candidate" >> "$GITHUB_OUTPUT"
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.candidate.outputs.sha }}
          fetch-depth: 1
      - name: Verify candidate syntax
        run: |
          node --check script.js
          node --check js/core/data-gateway.js
          node --check js/core/ui-bridge.js
          node --check js/core/sync-manager.js
          node --check worker.js
      - name: Deploy isolated candidate Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.124.0"
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: >-
            deploy
            --name gotavita-manager-pr-${{ github.event.pull_request.number || 'manual' }}
            --var GV_RELEASE_SHA:${{ steps.candidate.outputs.sha }}
      - name: Verify exact preview health
        env:
          EXPECTED_SHA: ${{ steps.candidate.outputs.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number || 'manual' }}
        run: |
          set -euo pipefail
          url="https://gotavita-manager-pr-${PR_NUMBER}.carleugenetolentino22.workers.dev/gv-health"
          for attempt in $(seq 1 12); do
            health="$(curl -fsS "$url" || true)"
            echo "Health: $health"
            deployed_sha="$(printf '%s' "$health" | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{try{console.log(JSON.parse(s).releaseSha||"")}catch{console.log("")}})')"
            if [ "$deployed_sha" = "$EXPECTED_SHA" ]; then exit 0; fi
            sleep 5
          done
          exit 1
