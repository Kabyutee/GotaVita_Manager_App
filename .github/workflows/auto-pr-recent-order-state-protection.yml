name: Auto-create recent Order protection PR

on:
  push:
    branches:
      - fix/recent-order-state-protection-auto-pr

permissions:
  contents: write
  pull-requests: write

jobs:
  open-pr-and-cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing="$(gh pr list --base main --head "${GITHUB_REF_NAME}" --state open --json number --jq '.[0].number')"
          if [ -z "$existing" ]; then
            gh pr create \
              --base main \
              --head "${GITHUB_REF_NAME}" \
              --title "fix: protect recent local Orders from stale state replacement" \
              --body "Centralize recent local Order protection at the application state replacement boundary. This prevents transient/stale remote snapshots from removing a freshly created or edited Order unless a newer deletion tombstone authorizes it."
          else
            echo "PR #$existing already exists."
          fi

      - name: Remove one-off workflow from branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/auto-pr-recent-order-state-protection.yml
          git commit -m "chore: remove one-off PR workflow"
          git push origin HEAD:${GITHUB_REF_NAME}
