name: ANTI BIG BANG 4.0 One Sync Authority Cleanup

on:
  push:
    branches:
      - fix/sprint18-incoming-sync-startup-race

permissions:
  contents: write

jobs:
  consolidate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Remove legacy independent dirty-state mirror
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("script.js")
          text = path.read_text(encoding="utf-8")

          text = text.replace("let syncLocalMirror = null;\n", "")
          text = text.replace("\n    syncLocalMirror =\n      clone(state);\n", "\n")

          pattern = re.compile(
              r'''\n    const resourcesChanged =\n      \[\];\n\n    if \(\n      syncLocalMirror\n    \) \{\n      for \(\n        const resource of SYNC_RESOURCES\n      \) \{\n        const stateName =\n          resourceStateName\(\n            resource\n          \);\n\n        const before =\n          JSON.stringify\(\n            syncLocalMirror\[\n              stateName\n            \] \|\| \[\]\n          \);\n\n        const after =\n          JSON.stringify\(\n            state\[\n              stateName\n            \] \|\| \[\]\n          \);\n\n        if \(\n          before !==\n          after\n        \) \{\n          resourcesChanged.push\(\n            resource\n          \);\n        \}\n      \}\n    \} else if \(\n      window.location.protocol !==\n      \"file:\"\n    \) \{\n      resourcesChanged.push\(\n        \.\.\.SYNC_RESOURCES\n      \);\n    \}\n\n    queueSyncResources\(\n      resourcesChanged\n    \);\n''',
              re.MULTILINE,
          )

          replacement = '''\n    // The queue is now a synchronization wake-up signal only.\n    // GVData.sync() owns authoritative dirty detection against the cloud baseline.\n    // Queue all supported resources after a local save so first-run/cloud-empty\n    // sessions are still eligible for synchronization; the gateway narrows the\n    // actual write set when a baseline exists.\n    if (window.location.protocol !== \"file:\") {\n      queueSyncResources(SYNC_RESOURCES);\n    }\n'''

          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit("persistState legacy syncLocalMirror block was not found")

          path.write_text(updated, encoding="utf-8")
          print("Removed legacy syncLocalMirror authority.")
          PY

      - name: Verify cleanup
        run: |
          ! grep -n "syncLocalMirror" script.js
          node --check script.js

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- script.js
          if git diff --cached --quiet; then
            echo "No cleanup changes required."
            exit 0
          fi
          git commit -m "ANTI BIG BANG 4.0: consolidate sync dirty-state authority"
          git push origin HEAD:${{ github.ref_name }}
