name: Sprint 19 Transaction Sync Readiness

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Verify transaction resource contract
        shell: bash
        run: |
          set -euo pipefail
          test -f js/core/data-gateway.js
          test -f js/core/sync-manager.js
          grep -q 'const TRANSACTION_RESOURCES' js/core/data-gateway.js
          grep -q 'orders' js/core/data-gateway.js
          grep -q 'payments' js/core/data-gateway.js
          grep -q 'expenses' js/core/data-gateway.js
          grep -q 'payroll_records' js/core/data-gateway.js
          grep -q 'order_group_items' js/core/data-gateway.js
          grep -q 'delivery_route_items' js/core/data-gateway.js
          grep -q 'audit_logs' js/core/data-gateway.js
          grep -q 'GVData.sync' js/core/sync-manager.js

      - name: Verify JavaScript syntax
        run: |
          node --check script.js
          node --check js/core/data-gateway.js
          node --check js/core/ui-bridge.js
          node --check js/core/sync-manager.js
          node --check worker.js

      - name: Verify sync remains explicitly disabled
        shell: bash
        run: |
          set -euo pipefail
          grep -RniE 'transaction.?sync|sync.*transaction' js/core script.js | head -80
          echo 'Readiness gate does not activate transaction sync.'
