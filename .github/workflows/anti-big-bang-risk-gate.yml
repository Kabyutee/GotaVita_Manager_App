name: ANTI BIG BANG 6.0 Risk Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  classify-and-test:
    runs-on: ubuntu-latest
    name: Classify change and run minimal safe gate
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: JARVIS 7.0 adaptive whole-application scan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node tests/anti-big-bang-7-adaptive-application-scan.test.js

      - name: JARVIS 8.0 runtime adaptation audit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node tests/jarvis-8-runtime-adaptation-audit.test.js

      - name: ANTI BIG BANG 6.0 whole-application connection audit
        run: node tests/anti-big-bang-6-application-connection-audit.test.js

      - name: ANTI BIG BANG 5.0 system audit
        run: node tests/anti-big-bang-4-system-audit.test.js

      - name: Classify changed areas
        id: risk
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")

          risk="low"
          ui=false
          sync=false
          data=false
          deployment=false
          workflow=false
          architecture=false
          full_audit=true

          for file in "${files[@]}"; do
            case "$file" in
              .github/workflows/*)
                deployment=true
                workflow=true
                ;;
              wrangler.jsonc|package.json|package-lock.json)
                deployment=true
                ;;
              js/core/sync-manager.js|js/core/state.js|js/core/data-gateway.js|js/core/conflict-resolution-integration.js|js/core/ui-bridge.js|js/core/sync-status.js|js/core/sync-cloud-write-reconciler.js|js/core/sync-queue-authority.js|js/core/sync-authority.js|js/core/sync-auth-startup-bridge.js|js/core/sync-checkbox-interaction-bridge.js|js/core/production-guard.js|js/core/group-membership-sync-bridge.js|script.js|tests/*sync*|tests/*conflict*|tests/jarvis-8-runtime-adaptation-audit.test.js|tests/anti-big-bang-4-system-audit.test.js|tests/anti-big-bang-5-sync-architecture-contract.test.js|tests/anti-big-bang-6-application-connection-audit.test.js|tests/anti-big-bang-7-adaptive-application-scan.test.js|tests/sprint18-order-number-reconciliation-contract.test.js|tests/sprint20-empty-resource-convergence-contract.test.js)
                sync=true
                ;;
              migrations/*|seed.js|data/*|supabase/*|server_data.json)
                data=true
                ;;
              *.html|*.css|js/modules/*)
                ui=true
                ;;
            esac
          done

          if $sync || $data || $full_audit; then
            risk="high"
          elif $deployment || $ui; then
            risk="medium"
          fi

          if $sync; then architecture=true; fi

          {
            echo "risk=$risk"
            echo "ui=$ui"
            echo "sync=$sync"
            echo "data=$data"
            echo "deployment=$deployment"
            echo "workflow=$workflow"
            echo "architecture=$architecture"
            echo "full_audit=true"
          } >> "$GITHUB_OUTPUT"

          echo "JARVIS 7.0 + JARVIS 8.0 + ANTI BIG BANG 6.0 risk=$risk ui=$ui sync=$sync data=$data deployment=$deployment workflow=$workflow architecture=$architecture full_audit=true"

      - name: Low-risk fast gate
        if: steps.risk.outputs.risk == 'low'
        run: node tests/sprint16-production-drift-gate-contract.test.js

      - name: Medium-risk gate
        if: steps.risk.outputs.risk == 'medium'
        run: |
          node tests/sprint16-production-drift-gate-contract.test.js
          node tests/sprint14-order-edit-group-contract.test.js
          node --check worker.js

      - name: High-risk core gate
        if: steps.risk.outputs.risk == 'high'
        run: |
          node tests/phase1-state-bridge.test.js
          node tests/phase3-hydration-runtime.test.js
          node tests/phase4-cross-device-sync.test.js
          node tests/sprint12-conflict-policy-contract.test.js
          node tests/sprint12-conflict-resolution-policy-contract.test.js
          node tests/sprint12-controlled-conflict-integration-contract.test.js
          node tests/sprint12-two-device-conflict-scenarios.test.js
          node tests/sprint14-order-edit-group-contract.test.js
          node tests/sprint18-transaction-sync-readiness-contract.test.js
          node tests/sprint18-sync-queue-preservation-contract.test.js
          node tests/sprint18-order-number-reconciliation-contract.test.js
          node tests/anti-big-bang-4-system-audit.test.js
          node tests/anti-big-bang-5-sync-architecture-contract.test.js
          node tests/anti-big-bang-6-application-connection-audit.test.js
          node tests/anti-big-bang-7-adaptive-application-scan.test.js
          node tests/jarvis-8-runtime-adaptation-audit.test.js
          node tests/sprint20-empty-resource-convergence-contract.test.js
          node --check js/core/sync-manager.js
          node --check js/core/sync-cloud-write-reconciler.js

      - name: Focused sync polling gate
        if: steps.risk.outputs.sync == 'true'
        run: node tests/sprint12-live-sync-polling-contract.test.js

      - name: Sync architecture gate
        if: steps.risk.outputs.architecture == 'true'
        run: |
          node tests/anti-big-bang-5-sync-architecture-contract.test.js
          node tests/anti-big-bang-6-application-connection-audit.test.js
          node tests/anti-big-bang-7-adaptive-application-scan.test.js
          node tests/jarvis-8-runtime-adaptation-audit.test.js
          node tests/sprint18-transaction-sync-readiness-contract.test.js
          node tests/sprint18-sync-queue-preservation-contract.test.js
          node tests/sprint20-empty-resource-convergence-contract.test.js

      - name: Workflow safety gate
        if: steps.risk.outputs.workflow == 'true'
        run: |
          node tests/anti-big-bang-4-system-audit.test.js
          node tests/anti-big-bang-6-application-connection-audit.test.js
          node tests/anti-big-bang-7-adaptive-application-scan.test.js
          node tests/jarvis-8-runtime-adaptation-audit.test.js
          node --check worker.js

      - name: Publish gate summary
        run: |
          echo "JARVIS 7.0 adaptive whole-application scan: REQUIRED"
          echo "JARVIS 8.0 runtime adaptation audit: REQUIRED"
          echo "ANTI BIG BANG 6.0 classification: ${{ steps.risk.outputs.risk }}"
          echo "UI: ${{ steps.risk.outputs.ui }}"
          echo "Sync: ${{ steps.risk.outputs.sync }}"
          echo "Data: ${{ steps.risk.outputs.data }}"
          echo "Deployment: ${{ steps.risk.outputs.deployment }}"
          echo "Workflow: ${{ steps.risk.outputs.workflow }}"
          echo "Architecture gate: ${{ steps.risk.outputs.architecture }}"
          echo "Whole-application connection audit: REQUIRED"
          echo "Production deployment: NOT performed by this workflow"
