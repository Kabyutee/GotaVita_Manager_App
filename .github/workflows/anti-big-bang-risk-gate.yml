name: ANTI BIG BANG 6.0 Risk Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:

permissions:
  contents: read

jobs:
  classify-and-test:
    runs-on: ubuntu-latest
    name: Classify change and run minimal safe gate
    steps:
      - uses: actions/checkout@v4
      - run: node tests/jarvis-9-business-first-adaptive-workflow.test.js
      - run: node tests/anti-big-bang-7-adaptive-application-scan.test.js
      - run: node tests/jarvis-8-runtime-adaptation-audit.test.js
      - run: node tests/jarvis-whole-app-hardening-contract.test.js
      - run: node tests/anti-big-bang-6-application-connection-audit.test.js
      - run: node tests/anti-big-bang-4-system-audit.test.js
      - run: node tests/sprint18-transaction-sync-readiness-contract.test.js
      - run: node tests/sprint18-sync-queue-preservation-contract.test.js
      - run: node tests/sprint18-order-number-reconciliation-contract.test.js
      - run: node tests/sprint20-sync-transaction-no-requeue-contract.test.js
      - run: node tests/sprint21-whole-sync-hardening-contract.test.js
      - run: node tests/sprint22-complete-runtime-sync-repair.test.js
      - run: node tests/anti-big-bang-5-sync-architecture-contract.test.js
      - run: node tests/sprint20-empty-resource-convergence-contract.test.js
      - run: node --check worker.js
      - run: node --check js/core/sync-manager.js
      - run: node --check js/core/conflict-resolution-integration.js
      - run: node --check js/core/sync-cloud-write-reconciler.js
      - run: node --check js/core/sync-authority.js
      - run: node --check js/core/sync-complete-runtime-repair.js
      - run: node --check js/core/order-write-boundary-bridge.js
