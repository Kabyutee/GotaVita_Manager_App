name: ANTI BIG BANG 3.0 Risk Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  classify-and-test:
    runs-on: ubuntu-latest
    name: Classify change and run minimal safe gate
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify risk from changed paths
        id: risk
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          risk="low"
          ui=false
          sync=false
          data=false
          deployment=false

          for file in "${files[@]}"; do
            case "$file" in
              .github/workflows/*|wrangler.jsonc|package.json|package-lock.json)
                deployment=true
                ;;
              js/core/sync-manager.js|js/core/state.js|js/core/data-gateway.js|js/core/conflict-resolution-integration.js|js/core/ui-bridge.js|tests/*sync*|tests/*conflict*)
                sync=true
                ;;
              migrations/*|seed.js|data/*|supabase/*|server_data.json)
                data=true
                ;;
              *.html|*.css|script.js|js/modules/*|js/core/ui-bridge.js)
                ui=true
                ;;
            esac
          done

          if $sync || $data; then
            risk="high"
          elif $deployment || $ui; then
            risk="medium"
          fi

          {
            echo "risk=$risk"
            echo "ui=$ui"
            echo "sync=$sync"
            echo "data=$data"
            echo "deployment=$deployment"
          } >> "$GITHUB_OUTPUT"

          echo "ANTI BIG BANG 3.0 risk=$risk ui=$ui sync=$sync data=$data deployment=$deployment"

      - name: Run low-risk fast contract
        if: steps.risk.outputs.risk == 'low'
        run: node tests/sprint16-production-drift-gate-contract.test.js

      - name: Run medium-risk safety checks
        if: steps.risk.outputs.risk == 'medium'
        run: |
          node tests/sprint16-production-drift-gate-contract.test.js
          node tests/sprint14-order-edit-group-contract.test.js
          node --check worker.js

      - name: Run high-risk safety checks
        if: steps.risk.outputs.risk == 'high'
        run: |
          node tests/phase1-state-bridge.test.js
          node tests/phase3-hydration-runtime.test.js
          node tests/phase4-cross-device-sync.test.js
          node tests/sprint12-conflict-policy-contract.test.js
          node tests/sprint12-conflict-resolution-policy-contract.test.js
          node tests/sprint12-controlled-conflict-integration-contract.test.js
          node tests/sprint12-two-device-conflict-scenarios.test.js
          node tests/sprint12-live-sync-polling-contract.test.js
          node tests/sprint14-order-edit-group-contract.test.js
          node tests/sprint16-production-drift-gate-contract.test.js
          node tests/sprint18-transaction-sync-readiness-contract.test.js
          node tests/sprint18-sync-queue-preservation-contract.test.js

      - name: Publish gate summary
        run: |
          echo "ANTI BIG BANG 3.0 classification: ${{ steps.risk.outputs.risk }}"
          echo "UI: ${{ steps.risk.outputs.ui }}"
          echo "Sync: ${{ steps.risk.outputs.sync }}"
          echo "Data: ${{ steps.risk.outputs.data }}"
          echo "Deployment: ${{ steps.risk.outputs.deployment }}"
          echo "Production deployment: NOT performed by this workflow"
