name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify JavaScript syntax
        run: |
          node --check script.js
          node --check js/core/state.js
          node --check js/core/data-gateway.js
          node --check js/core/ui-bridge.js
          node --check js/core/sync-manager.js
          node --check js/core/conflict-resolution-integration.js
          node --check tests/sprint21-universal-canonical-sync-behavior.test.js
          node --check tests/sprint21-whole-sync-hardening-contract.test.js
          node --check js/modules/groups-routes.js
          node --check worker.js

      - name: JARVIS 9.0 business-first adaptive workflow
        env:
          BASE_SHA: ${{ github.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: node tests/jarvis-9-business-first-adaptive-workflow.test.js

      - name: Run full regression contracts
        run: |
          node tests/phase1-state-bridge.test.js
          node tests/phase3-hydration-runtime.test.js
          node tests/phase4-cross-device-sync.test.js
          node tests/sprint11-release-readiness.test.js
          node tests/sprint12-state-hydration-contract.test.js
          node tests/sprint12-hydration-hardening.test.js
          node tests/sprint12-hydration-ordering-contract.test.js
          node tests/sprint12-state-ownership-contract.test.js
          node tests/sprint12-schema-adapter-contract.test.js
          node tests/sprint12-write-safety-contract.test.js
          node tests/sprint12-controlled-write-activation-contract.test.js
          node tests/sprint12-write-roundtrip-contract.test.js
          node tests/sprint12-conflict-detection-contract.test.js
          node tests/sprint12-conflict-policy-contract.test.js
          node tests/sprint12-conflict-resolution-policy-contract.test.js
          node tests/sprint12-controlled-conflict-integration-contract.test.js
          node tests/sprint12-two-device-conflict-scenarios.test.js
          node tests/sprint12-live-sync-polling-contract.test.js
          node tests/sprint14-order-edit-group-contract.test.js
          node tests/sprint15-production-regression-gate-contract.test.js
          node tests/sprint21-universal-canonical-sync-behavior.test.js
          node tests/sprint21-whole-sync-hardening-contract.test.js

      - name: Deploy exact main commit to Cloudflare
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.124.0"
          vars: |
            GV_RELEASE_SHA
          command: deploy
        env:
          GV_RELEASE_SHA: ${{ github.sha }}

      - name: Verify production release SHA
        run: |
          set -euo pipefail
          expected="${GITHUB_SHA}"
          actual="$(curl -fsS https://gotavita-manager.pages.dev/gv-health | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{const x=JSON.parse(s);process.stdout.write(x.releaseSha||"")})')"
          test "$actual" = "$expected"
          echo "Production release verified: $actual"
