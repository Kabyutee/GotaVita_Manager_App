name: GotaVita Sprint 10 State Migration

on:
  push:
    branches:
      - phase1-state-bridge
  pull_request:
    branches:
      - main
      - phase1-state-bridge

jobs:
  verify-state-migration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify JavaScript syntax
        run: |
          node --check script.js
          node --check js/core/state.js
          node --check js/core/data-gateway.js
          node --check js/core/ui-bridge.js

      - name: Run State Bridge, Hydration, and Cross-Device contracts
        run: |
          node tests/phase1-state-bridge.test.js
          node tests/phase3-hydration-runtime.test.js
          node tests/phase4-cross-device-sync.test.js
