name: GotaVita State and Release Verification

on:
  push:
    branches:
      - phase1-state-bridge
      - sprint11-regression-release
      - sprint12-state-hydration
      - sprint12-hydration-ordering
      - sprint12-state-ownership
      - sprint12-schema-adapter
      - sprint12-write-safety
      - sprint12-controlled-write-activation
      - sprint12-convergence-policy
  pull_request:
    branches:
      - main
      - phase1-state-bridge
      - sprint11-regression-release
      - sprint12-state-hydration
      - sprint12-hydration-ordering
      - sprint12-state-ownership
      - sprint12-schema-adapter
      - sprint12-write-safety
      - sprint12-controlled-write-activation
      - sprint12-convergence-policy

jobs:
  verify-gotavita:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify JavaScript syntax
        run: |
          node --check script.js
          node --check js/core/state.js
          node --check js/core/data-gateway.js
          node --check js/core/ui-bridge.js

      - name: Run automated contracts
        run: |
          node tests/phase1-state-bridge.test.js
          node tests/phase3-hydration-runtime.test.js
          node tests/phase4-cross-device-sync.test.js
          node tests/sprint11-release-readiness.test.js
          node tests/sprint12-state-hydration-contract.test.js
          node tests/sprint12-hydration-hardening.test.js
          node tests/sprint12-hydration-ordering-contract.test.js
          node tests/sprint12-state-ownership-contract.test.js
          node tests/sprint12-schema-adapter-contract.test.js
          node tests/sprint12-write-safety-contract.test.js
          node tests/sprint12-controlled-write-activation-contract.test.js
          node tests/sprint12-write-roundtrip-contract.test.js
          node tests/sprint12-convergence-policy-contract.test.js
