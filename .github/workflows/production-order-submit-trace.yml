name: GotaVita Production Order Submit Trace

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: Production Worker URL
        required: false
        default: https://gotavita-manager-app.carleugenetolentino22.workers.dev
        type: string

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOTAVITA_PRODUCTION_URL: ${{ inputs.target_url || 'https://gotavita-manager-app.carleugenetolentino22.workers.dev' }}
      E2E_MANAGER_EMAIL: ${{ secrets.E2E_MANAGER_EMAIL }}
      E2E_MANAGER_PASSWORD: ${{ secrets.E2E_MANAGER_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock @playwright/test@latest
          npx playwright install --with-deps chromium

      - name: Run isolated production Order trace
        run: npx playwright test tests/e2e/production-order-submit-trace.spec.js --reporter=line

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-order-submit-trace-report
          path: test-results/
          if-no-files-found: ignore
